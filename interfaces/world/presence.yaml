# presence: who is around, as the semantic world believes it. Presence is not availability and not consent
# (notes/volume-02-setting.md); a member that wants to speak reads conversation.floor, not this.
family: presence
version: 1
owner: world
ports:
  present:      {world_port: present,      keys: [room], levels: {presence: {at: [0.3, 0.7], names: [nobody, maybe_someone, someone]}}}
  someone_home: {world_port: someone_home, keys: [],     levels: {household: {at: [0.3, 0.7], names: [nobody_home, unsure_home, someone_home]}}}
edges:                           # asserted by the host for one beat, on the edge named, from the level change
  - {pred: entered(room),  when: {kind: presence_edge, edge: entered}}
  - {pred: came_home,      when: {kind: presence_edge, edge: came_home}}
  - {pred: left_home,      when: {kind: presence_edge, edge: left_home}}
commands: {}
receipts: {via: none}
freshness: {feed_down: forget}   # the radar's "off" decays only while the feed is up (semantic-world DESIGN §4)
consumers: [lights, comfort, scenes, attention, social]
families:
  scenes:
    reads:
    - someone_home
    - nobody_home
    - home_unsensed
    - day
    - night
    outcomes:
    - done
    - refused
    - scene_lights
    - scene_air
    - scene_media
    - suggest
    - welcomed
    events:
    - left_home
    - came_home
    - dawn
