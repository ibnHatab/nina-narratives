family: public_search
version: 1
owner: host
ports: {}
edges:
- pred: source_requested(task)
  when:
    kind: report
    var: source_requested
  args:
  - task
  lifetime: consumed
- pred: public_hit(task,reference)
  when:
    kind: report
    var: public_hit
  args:
  - task
  - reference
  lifetime: consumed
- pred: requester_verified(task,reference)
  when:
    kind: report
    var: requester_verified
  args:
  - task
  - reference
  lifetime: consumed
- pred: credited_evidence(reference,source_record)
  when:
    kind: report
    var: credited_evidence
  args:
  - reference
  - source_record
  lifetime: consumed
- pred: reported_common_origin(reference,source_record)
  when:
    kind: report
    var: reported_common_origin
  args:
  - reference
  - source_record
  lifetime: consumed
commands: {}
receipts:
  via: none
consumers:
- curiosity
- situations
capability: public_search
