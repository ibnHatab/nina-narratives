family: community_media
version: 1
owner: host
ports: {}
edges:
- pred: shared_component(asset,participant)
  when:
    kind: report
    var: shared_component
  args:
  - asset
  - participant
  lifetime: consumed
- pred: display_permission(asset,participant)
  when:
    kind: report
    var: display_permission
  args:
  - asset
  - participant
  lifetime: consumed
- pred: media_provider_unavailable(asset)
  when:
    kind: report
    var: media_provider_unavailable
  args:
  - asset
  lifetime: consumed
- pred: approved_local_media(asset)
  when:
    kind: report
    var: approved_local_media
  args:
  - asset
  lifetime: consumed
commands: {}
receipts:
  via: none
consumers:
- attention
- social
capability: community_media
