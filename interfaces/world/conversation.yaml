# conversation: the speech floor and what a person says, the one family every incarnation has.
# Home: the voice (fsttm-live floor machine). Office: the hall's voice plus typed sessions per participant and
# channel; a reply in the hall is public, a private chat stays private (notes/volume-02-setting.md).
family: conversation
version: 1
owner: person
ports: {}                        # no semantic-world port yet (interfaces/README.md "Open"): edges only
edges:                           # the person's words, as report events {person, id: task, var, value}; lifetime:
                                 # beat (retracted after one beat unless consumed) | consumed (kept until a rule uses it)
  - {pred: floor,                   when: {kind: floor},                    lifetime: beat,     note: "the floor machine opens a turn Nina may take"}
  - {pred: "arrived(task)",         when: {kind: report, var: arrived},     lifetime: consumed, note: "a person hands Nina something to keep"}
  - {pred: "later(task)",           when: {kind: report, var: deferral, value: later}, lifetime: consumed}
  - {pred: "renewed(task)",         when: {kind: report, var: renewed},     lifetime: consumed, note: "the person asks again"}
  - {pred: "completion_report(task)", when: {kind: report, var: done},      lifetime: consumed, note: "the person says it is done"}
  - {pred: "addressed(channel)",    when: {kind: report, var: addressed},   lifetime: beat,     note: "the utterance names Nina or is in her session"}
commands:
  say:     {rules: [speak, mention], args: [task], predicts: {var: uttered, value: "{task}"}, grace_s: 5, adapter: {person: hear}}   # the person hears it
  message: {rules: [post_message], args: [channel], predicts: {var: posted,  value: "{text}"}, grace_s: 30, adapter: {mcp: {server: chat, tool: send_message}}}
receipts: {via: report}          # the adapter reports uttered/posted with ref = the command id
consumers: [attention, commitments, social, situations]
