# conversation: the speech floor and what a person says, the one family every incarnation has.
# Home: the voice (fsttm-live floor machine). Office: the hall's voice plus typed sessions per participant and
# channel; a reply in the hall is public, a private chat stays private (notes/volume-02-setting.md).
family: conversation
version: 1
owner: person
ports: {}                        # no semantic-world port yet (interfaces/README.md "Open"): edges only
edges:                           # each logged as a report event {person, id: task|topic, var, value, ref: utterance}
  - {pred: floor,                    from: "the floor machine opens a turn Nina may take"}
  - {pred: arrived(task),            from: "report var=arrived: a person hands Nina something to keep"}
  - {pred: later(task),              from: "report var=deferral value=later"}
  - {pred: renewed(task),            from: "report var=renewed: the person asks again"}
  - {pred: completion_report(task),  from: "report var=done: the person says it is done"}
  - {pred: addressed(channel),       from: "office: the utterance names Nina or is in her session"}
commands:
  say:     {rules: [speak, mention], args: [channel], predicts: {var: uttered, value: "{text}"}, grace_s: 5, adapter: {voice: floor}}   # the voice confirms it was spoken
  message: {rules: [speak], args: [channel], predicts: {var: posted,  value: "{text}"}, grace_s: 30, adapter: {mcp: {server: chat, tool: send_message}}}
receipts: {via: report}          # the adapter reports uttered/posted with ref = the command id
consumers: [attention, commitments, social, situations]
