# climate: room temperature and humidity, Kalman-filtered by the semantic world (outliers beyond 4 sd refused).
family: climate
version: 1
owner: world
ports:
  cold:  {world_port: cold,  keys: [room], levels: {chill: {at: [0.5, 0.9], names: [not_cold, maybe_cold, cold]}}}
  warm:  {world_port: warm,  keys: [room], levels: {heat:  {at: [0.5, 0.9], names: [not_warm, maybe_warm, warm]}}}
  humid: {world_port: humid, keys: [room], levels: {damp:  {at: [0.5, 0.9], names: [dry, maybe_humid, humid]}}}
edges: []
commands: {}
receipts: {via: none}
consumers: [comfort, air, situations]
families:
  comfort:
    reads:
    - running
    - stopped
    - heater_on
    - heater_off
    - cold_room
    - comfy_room
    - warm_room
    - untracked
    - humid_room
    - fresh_room
    - humidity_unknown
    outcomes:
    - advise_air
    - advise_heater
    - advise_open
    - noted
    - said
    - refused
    events:
    - got_cold
    - got_warm
    - got_humid
