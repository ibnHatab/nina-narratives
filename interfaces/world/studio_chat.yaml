family: studio_chat
version: 1
owner: host
ports: {}
edges:
- pred: community_role(participant)
  when:
    kind: report
    var: community_role
  args:
  - participant
  lifetime: consumed
- pred: agreed_social_scope(participant)
  when:
    kind: report
    var: agreed_social_scope
  args:
  - participant
  lifetime: consumed
- pred: identity_guess(encounter,participant)
  when:
    kind: report
    var: identity_guess
  args:
  - encounter
  - participant
  lifetime: consumed
- pred: identity_correction(encounter,participant)
  when:
    kind: report
    var: identity_correction
  args:
  - encounter
  - participant
  lifetime: consumed
- pred: correction_allowed(encounter)
  when:
    kind: report
    var: correction_allowed
  args:
  - encounter
  lifetime: consumed
- pred: prepared_prompt(task)
  when:
    kind: report
    var: prepared_prompt
  args:
  - task
  lifetime: consumed
- pred: discussion_opt_in(channel)
  when:
    kind: report
    var: discussion_opt_in
  args:
  - channel
  lifetime: consumed
- pred: prompt_opening(channel)
  when:
    kind: report
    var: prompt_opening
  args:
  - channel
  lifetime: consumed
commands: {}
receipts:
  via: none
consumers:
- attention
- situations
- social
capability: studio_chat
