# The home's mode: home, night, away. Its host fans a new mode out to the other packages.
display: the home
line: "scenes: the home's mode (home, night, away) at a word; away suggested when the home empties, the night's end at dawn"
voice: own
program: scenes.llp
host: nina_world.host:scenes   # the runtime's world host (interfaces/README.md): SITL sitl/nina_world, nina-live its own
intent: {spec: intent.yaml}
clock: {beats: 1, period: 1}
records: records/
commands: [scene_set, arrive, mood_set, mood_change]
shared: {scene_lights: out, scene_air: out, scene_media: out, scene_timers: out, scene_music: out, mood_music: out, mood_glow: out, ask_scenes: in}   # the home composition: a scene's wishes (iface/home.llp)
