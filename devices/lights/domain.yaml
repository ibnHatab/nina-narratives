# Lighting over the home's roles (l1.., r1..); world/home.map.json binds them.
display: the lights
line: "the lights: on and off at a word or a scene, off in a room left vacant, a light offered on entering a dark room at night"
voice: own
program: lights.llp
host: nina_world.host:lights   # the runtime's world host (interfaces/README.md): SITL sitl/nina_world, nina-live its own
intent: {spec: intent.yaml}
clock: {beats: 1, period: 1}
records: records/
# the semantic world (metis-worlds libs/semantic-world/go, served by metis-home): the beliefs the rules read, as levels (spec 16)
beliefs: {present_b: {port: present}, mode_b: {port: mode, one: M}}
levels: {presence: {from: {belief: present}, at: [0.3, 0.7], names: [nobody, maybe_someone, someone]}, home_mode: {from: {belief: mode}, at: [0.5], names: ["no", "yes"]}}
commands: [light_on, light_off, sweep_off, vacant_off]
shared: {ask_lights: in}   # the home composition: a scene's wishes (iface/home.llp)
