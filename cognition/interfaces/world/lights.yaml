# lights: the home's lights, through Home Assistant's MCP server.
family: lights
version: 1
owner: world
ports:
  light_on: {world_port: light_on, keys: [light], levels: {lamp: {at: [0.05, 0.95], names: ["off", unconfirmed, "on"]}}}
edges: []
commands:
  light_on:  {rules: [light_on], args: [light], predicts: {var: power, value: "on"}, grace_s: 15,
              adapter: {mcp: {server: ha, tool: HassTurnOn, args: {name: "{light.entity}"}}}}
  light_off: {rules: [light_off, sweep_off, vacant_off], args: [light], predicts: {var: power, value: "off"}, grace_s: 15,
              adapter: {mcp: {server: ha, tool: HassTurnOff, args: {name: "{light.entity}"}}}}
receipts: {via: ha_state}
consumers: [lights, scenes]
families:
  lights:
    reads:
    - light_lit
    - light_dark
    - light_ok
    - light_missing
    - room_lit
    - room_unlit
    - occupied
    - empty
    - vacant
    - unsensed
    - day
    - night
    outcomes:
    - done
    - refused
    - switched
    - kept
    - missed
    - auto_off
    - suggest_light
    events:
    - entered
    owned:
    - light_lit
    - light_dark
    - room_lit
    - room_unlit
role_map: lights
bindings: {light.entity: "{entity}"}
