# ventilation: the recuperators, through Home Assistant's MCP server. Home only.
family: ventilation
version: 1
owner: world
ports:
  unit_on:  {world_port: unit_on,      keys: [unit], levels: {power:   {at: [0.05, 0.95], names: ["off", unconfirmed, "on"]}}}
  reach:    {world_port: reachable, keys: [unit], levels: {answers: {at: [0.5],        names: [silent, answering]}}}
  out_cold: {world_port: out_cold, keys: [unit], levels: {outside: {at: [0.5],        names: [mild_out, cold_out]}}}
  preset:   {world_port: preset,   keys: [unit, mode], one: mode}
edges:
  - {pred: unit_missing(unit), from: "reach(U) falls below 0.5"}
commands:                        # out: a fired rule named in `rules` → world command event → adapter call
  unit_on:     {rules: [air_on], args: [unit], predicts: {var: power, value: "on"}, grace_s: 15,
                adapter: {mcp: {server: ha, tool: HassTurnOn, args: {name: "{unit.fans}"}}}}
  unit_off:    {rules: [air_off, air_off_cold, sweep_air_off, sweep_air_off_heat], args: [unit], predicts: {var: power, value: "off"}, grace_s: 15,
                adapter: {mcp: {server: ha, tool: HassTurnOff, args: {name: "{unit.fans}"}}}}
  unit_preset: {rules: [air_night, air_night_from_boost, sweep_night, sweep_night_boost, air_boost, air_boost_from_night, normal_from_night, normal_from_boost],
                args: [unit], predicts: {var: preset, value: "{rule.preset}"}, grace_s: 15,
                adapter: {mcp: {server: ha, tool: HassFanSetPresetMode, args: {name: "{unit.supply}", preset_mode: "{rule.preset}"}}}}
  unit_switch: {rules: [heater_up, heater_down, winter_up, winter_down], args: [unit], predicts: {var: "{rule.switch}", value: "{rule.state}"}, grace_s: 15,
                adapter: {mcp: {server: ha, tool: "{rule.tool}", args: {name: "{unit.switch}"}}}}
receipts: {via: ha_state}        # the world confirms a command by a reading; none within grace_s → world surprise
freshness: {feed_down: forget}
consumers: [air, comfort, scenes]
families:
  air:
    reads:
    - running
    - stopped
    - normal_mode
    - night_mode
    - boost_mode
    - heater_on
    - heater_off
    - winter_on
    - winter_off
    - unit_ok
    - unit_missing
    - cold_out
    - mild_out
    - out_unknown
    outcomes:
    - done
    - refused
    - switched
    - kept
    - missed
    - advise_winter
    - noted
    events:
    - chilled
    owned:
    - normal_mode
    - night_mode
    - boost_mode
    - heater_on
    - heater_off
    - winter_on
    - winter_off
role_map: units
bindings:
  unit.supply: fan.{prefix}_supply_fan
  unit.fans:
  - fan.{prefix}_supply_fan
  - fan.{prefix}_extract_fan
  unit.switch: switch.{prefix}_{rule.switch}
values:
  air_night:
    rule.preset: night
  air_night_from_boost:
    rule.preset: night
  sweep_night:
    rule.preset: night
  sweep_night_boost:
    rule.preset: night
  air_boost:
    rule.preset: boost
  air_boost_from_night:
    rule.preset: boost
  normal_from_night:
    rule.preset: normal
  normal_from_boost:
    rule.preset: normal
  heater_up:
    rule.switch: heater
    rule.state: 'on'
    rule.tool: HassTurnOn
  heater_down:
    rule.switch: heater
    rule.state: 'off'
    rule.tool: HassTurnOff
  winter_up:
    rule.switch: winter
    rule.state: 'on'
    rule.tool: HassTurnOn
  winter_down:
    rule.switch: winter
    rule.state: 'off'
    rule.tool: HassTurnOff
