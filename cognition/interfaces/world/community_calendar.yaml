family: community_calendar
version: 1
owner: host
ports: {}
edges:
- pred: invited_guest(task,participant)
  when:
    kind: report
    var: invited_guest
  args:
  - task
  - participant
  lifetime: consumed
- pred: accepted_invite(task,participant)
  when:
    kind: report
    var: accepted_invite
  args:
  - task
  - participant
  lifetime: consumed
- pred: observed_plan(task,slot)
  when:
    kind: report
    var: observed_plan
  args:
  - task
  - slot
  lifetime: consumed
- pred: agreed_revision(task,slot,slot)
  when:
    kind: report
    var: agreed_revision
  args:
  - task
  - slot_2
  - slot_3
  lifetime: consumed
- pred: tentative_reply(task,participant)
  when:
    kind: report
    var: tentative_reply
  args:
  - task
  - participant
  lifetime: consumed
- pred: delegated_followup(task,participant)
  when:
    kind: report
    var: delegated_followup
  args:
  - task
  - participant
  lifetime: consumed
- pred: followup_receipt(task,participant)
  when:
    kind: report
    var: followup_receipt
  args:
  - task
  - participant
  lifetime: consumed
commands: {}
receipts:
  via: none
consumers:
- commitments
capability: community_calendar
